<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Rohan C. Python, Artificial Intelligence and Automation." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0e1a"/>
      <stop offset="0.55" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#2d3a75"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a9b8ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa2ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fa2ff"/>
      <stop offset="1" stop-color="#8fa2ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5468d4" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5468d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fa2ff" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="280" rx="18"/></clipPath>
  </defs>

  <style>
    .rise  { animation: rise 1.1s ease-out 0.15s backwards; }
    .fade  { animation: fade 1.2s ease-out 0.75s backwards; }
    .rule  { transform-box: fill-box; transform-origin: center; animation: grow 1.1s ease-out 0.5s backwards; }
    .node  { animation: pulse 3.2s ease-in-out infinite; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: 0.8s; } .d3 { animation-delay: 1.6s; } .d4 { animation-delay: 2.4s; }
    @keyframes rise  { from { opacity: 0; transform: translateY(14px); } }
    @keyframes fade  { from { opacity: 0; } }
    @keyframes grow  { from { transform: scaleX(0); } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <ellipse cx="600" cy="125" rx="540" ry="170" fill="url(#glow)"/>

    <g stroke="#8fa2ff" stroke-opacity="0.22" stroke-width="1.2" fill="none">
      <path d="M60 70 L150 120 L110 200 L230 170 L290 230"/>
      <path d="M150 120 L230 60 L330 110 L230 170"/>
      <path d="M1140 70 L1050 120 L1090 200 L970 170 L910 230"/>
      <path d="M1050 120 L970 60 L870 110 L970 170"/>
    </g>
    <g fill="#8fa2ff">
      <circle class="node d1" cx="60"  cy="70"  r="4"/>
      <circle class="node d2" cx="150" cy="120" r="5"/>
      <circle class="node d3" cx="110" cy="200" r="4"/>
      <circle class="node d4" cx="230" cy="170" r="5"/>
      <circle class="node d1" cx="230" cy="60"  r="3.5"/>
      <circle class="node d3" cx="330" cy="110" r="4"/>
      <circle class="node d2" cx="290" cy="230" r="3.5"/>
      <circle class="node d2" cx="1140" cy="70"  r="4"/>
      <circle class="node d1" cx="1050" cy="120" r="5"/>
      <circle class="node d4" cx="1090" cy="200" r="4"/>
      <circle class="node d3" cx="970"  cy="170" r="5"/>
      <circle class="node d2" cx="970"  cy="60"  r="3.5"/>
      <circle class="node d4" cx="870"  cy="110" r="4"/>
      <circle class="node d1" cx="910"  cy="230" r="3.5"/>
    </g>

    <text class="rise" x="600" y="146" text-anchor="middle" fill="url(#name)"
          font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="-1">Rohan C</text>

    <rect class="rule" x="420" y="172" width="360" height="2" fill="url(#rule)"/>

    <text class="fade" x="600" y="214" text-anchor="middle" fill="#b9c3ff"
          font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="5">PYTHON  ·  ARTIFICIAL INTELLIGENCE  ·  AUTOMATION</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
